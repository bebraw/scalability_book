<section
  id="demo-deterministic-boundary-lab"
  data-demo-anchor
  class="scaling-demo statechart-demo statechart-workflow-demo"
  data-statechart-demo
  aria-labelledby="statechart-demo-heading"
>
  <div class="scaling-demo-header demo-header">
    <div>
      <p class="scaling-demo-kicker demo-kicker">Deterministic boundary lab</p>
      <h3 id="statechart-demo-heading">Can this patch ship?</h3>
    </div>
    <div class="scaling-demo-summary demo-summary">
      <small>Current state</small>
      <span data-statechart-demo-agent-state>Planning</span>
    </div>
  </div>

  <form class="statechart-workflow-layout" data-statechart-demo-form>
    <div class="statechart-proposal">
      <button type="button" data-statechart-demo-propose-release>
        Propose RELEASE
      </button>
      <p role="status" data-statechart-demo-result></p>
    </div>
    <div class="statechart-actions">
      <span id="statechart-next-events">Enabled events</span>
      <div
        class="statechart-agent-options"
        role="group"
        aria-labelledby="statechart-next-events"
        data-statechart-demo-events-enabled
      ></div>
    </div>
    <div
      class="statechart-workflow-canvas"
      data-statechart-demo-chart
      role="region"
      aria-label="Patch delivery statechart"
    >
      <div data-statechart-map-placeholder></div>
    </div>
    <div class="statechart-tools">
      <button type="button" data-statechart-demo-checkpoint hidden>
        Load patch B checkpoint
      </button>
      <button type="button" data-statechart-demo-reset disabled>
        Reset run
      </button>
    </div>
    <div
      class="statechart-checkpoint-controls"
      data-statechart-demo-prompt
      hidden
    >
      <label>
        <span
          >B has review approval. A delayed test pass arrives from patch A. What
          happens to B?</span
        >
        <select data-statechart-demo-prediction>
          <option value="">Choose your prediction</option>
          <option value="waiting">Keep waiting for B’s tests</option>
          <option value="ready">Mark B ready for release</option>
        </select>
      </label>
      <button type="button" data-statechart-demo-deliver disabled>
        Deliver patch A’s result
      </button>
      <p role="status" data-statechart-demo-feedback></p>
    </div>
    <div class="statechart-inspect">
      <details class="statechart-history">
        <summary>
          Event history (<span data-statechart-demo-count>0</span>)
        </summary>
        <ol data-statechart-demo-history>
          <li class="is-empty">No events sent yet.</li>
        </ol>
      </details>
      <details class="statechart-demo-definition">
        <summary>Executable model</summary>
        <div class="statechart-demo-definition-actions">
          <button type="button" data-statechart-demo-copy>
            Copy XState model
          </button>
          <a href="https://sketch.stately.ai" target="_blank" rel="noreferrer"
            >Open Stately Sketch ↗</a
          >
        </div>
        <pre
          class="statechart-demo-model"
          tabindex="0"
          aria-label="XState change delivery machine"
        ><code class="hljs language-typescript" data-statechart-demo-model></code></pre>
      </details>
    </div>
  </form>
  <p class="demo-note">Test results in this lab are simulated inputs.</p>
</section>
