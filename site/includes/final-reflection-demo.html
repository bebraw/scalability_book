<section
  id="demo-final-reflection-package"
  data-demo-anchor
  class="reflection-package-demo"
  data-reflection-package-demo
  aria-labelledby="reflection-package-demo-heading"
>
  <div class="reflection-package-demo-header">
    <div>
      <p class="reflection-package-demo-kicker">Compare evidence index</p>
      <h3 id="reflection-package-demo-heading">
        Assemble the four Compare bundles
      </h3>
    </div>
    <div class="reflection-package-demo-summary" aria-live="polite">
      <span data-reflection-package-verdict>Select assembled bundles</span>
      <small
        >Selections organize your evidence; they do not verify completeness or
        the strength of a claim. Check the
        <a href="/project/compare/#6-deliverables">Compare deliverables</a>.
      </small>
    </div>
  </div>

  <form class="reflection-package-grid" data-reflection-package-form>
    <div class="reflection-package-panel">
      <h4>Bundles with linked evidence</h4>
      <div class="reflection-package-evidence">
        <label>
          <input
            type="checkbox"
            value="implementation"
            data-reflection-package-evidence
            checked
          />
          <span
            ><strong>Implementation</strong
            ><small
              >Accepted C revision and common evidence, including the cross-team
              audit and response; links to A and B.</small
            ></span
          >
        </label>
        <label>
          <input
            type="checkbox"
            value="fleet"
            data-reflection-package-evidence
          />
          <span
            ><strong>Fleet evidence</strong
            ><small
              >Plan, trace, loader, two debugging findings, coordination
              measurements, and workflow model.</small
            ></span
          >
        </label>
        <label>
          <input
            type="checkbox"
            value="experiment"
            data-reflection-package-evidence
            checked
          />
          <span
            ><strong>Scaling and deployment experiment</strong
            ><small
              >Application model, implemented and remeasured response, failure
              or recovery check, and deployed workload.</small
            ></span
          >
        </label>
        <label>
          <input
            type="checkbox"
            value="decision"
            data-reflection-package-evidence
          />
          <span
            ><strong>Final decision</strong
            ><small
              >Evidence matrix, target architecture, trade-offs, and one
              conditional decision with ownership and a revisit
              condition.</small
            ></span
          >
        </label>
      </div>
    </div>

    <div class="reflection-package-panel reflection-package-gaps">
      <h4>Bundles still to assemble</h4>
      <ul data-reflection-package-missing></ul>
    </div>

    <div class="reflection-package-panel reflection-package-outline">
      <div class="reflection-package-outline-header">
        <h4>Draft evidence index</h4>
        <button type="button" data-reflection-package-copy>Copy package</button>
      </div>
      <textarea
        data-reflection-package-outline
        aria-label="Generated Compare evidence index"
        rows="18"
        readonly
        spellcheck="false"
      ></textarea>
    </div>
  </form>
</section>
