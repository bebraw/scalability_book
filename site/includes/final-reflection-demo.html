<section
  id="demo-final-reflection-package"
  data-demo-anchor
  class="reflection-package-demo"
  data-reflection-package-demo
  aria-labelledby="reflection-package-demo-heading"
>
  <div class="reflection-package-demo-header">
    <div>
      <p class="reflection-package-demo-kicker">Final reflection package</p>
      <h3 id="reflection-package-demo-heading">
        Build a reflection from course artifacts
      </h3>
    </div>
    <div class="reflection-package-demo-summary" aria-live="polite">
      <span data-reflection-package-verdict>Pick project evidence</span>
      <small
        >A strong reflection names the artifact, the claim it supports, and the
        limitation it does not prove.</small
      >
    </div>
  </div>

  <form class="reflection-package-grid" data-reflection-package-form>
    <div class="reflection-package-panel">
      <h4>Artifacts in your folder</h4>
      <div class="reflection-package-evidence">
        <label>
          <input
            type="checkbox"
            value="architecture"
            data-reflection-package-evidence
            checked
          />
          <span>
            <strong>Request trace screenshot or ADR</strong>
            <small
              >Example: POST /events boundary trace with owner notes.</small
            >
          </span>
        </label>
        <label>
          <input
            type="checkbox"
            value="assumption"
            data-reflection-package-evidence
            checked
          />
          <span>
            <strong>Changed assumption brief</strong>
            <small
              >Example: offline retries made duplicate events visible.</small
            >
          </span>
        </label>
        <label>
          <input
            type="checkbox"
            value="friction"
            data-reflection-package-evidence
            checked
          />
          <span>
            <strong>Friction audit result</strong>
            <small
              >Example: one required event field touched UI, API, and summary
              code.</small
            >
          </span>
        </label>
        <label>
          <input
            type="checkbox"
            value="measurement"
            data-reflection-package-evidence
            checked
          />
          <span>
            <strong>Measurement screenshot or table</strong>
            <small
              >Example: trace showed database time, not rendering, dominated
              p95.</small
            >
          </span>
        </label>
        <label>
          <input
            type="checkbox"
            value="workflow"
            data-reflection-package-evidence
          />
          <span>
            <strong>Human-agent workflow trace</strong>
            <small
              >Example: scout found files, implementer changed them, reviewer
              caught a missing path.</small
            >
          </span>
        </label>
        <label>
          <input
            type="checkbox"
            value="scaling"
            data-reflection-package-evidence
            checked
          />
          <span>
            <strong>Scaling trade-off table</strong>
            <small
              >Example: queue ingestion helped writes but created freshness
              lag.</small
            >
          </span>
        </label>
        <label>
          <input
            type="checkbox"
            value="risk"
            data-reflection-package-evidence
          />
          <span>
            <strong>Remaining risk note</strong>
            <small
              >Example: next failure is queue backlog; measure event age before
              adding workers.</small
            >
          </span>
        </label>
      </div>
    </div>

    <div class="reflection-package-panel reflection-package-gaps">
      <h4>What to add before writing</h4>
      <ul data-reflection-package-missing></ul>
    </div>

    <div class="reflection-package-panel reflection-package-outline">
      <div class="reflection-package-outline-header">
        <h4>Draft package</h4>
        <button type="button" data-reflection-package-copy>Copy package</button>
      </div>
      <textarea
        data-reflection-package-outline
        rows="18"
        readonly
        spellcheck="false"
      ></textarea>
    </div>
  </form>
</section>
