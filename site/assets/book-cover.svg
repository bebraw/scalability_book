<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title description">
  <title id="title">Elements of Scalable Web Development book cover</title>
  <desc id="description">White book cover with dark title text, a green stripe, a subtitle, and a dark lower section.</desc>
  <defs>
    <clipPath id="cover-clip">
      <rect width="900" height="1200" rx="22" />
    </clipPath>
  </defs>
  <rect width="900" height="1200" fill="#ffffff" rx="22" />
  <g clip-path="url(#cover-clip)">
    <rect width="900" height="1200" fill="#ffffff" />
    <rect y="818" width="900" height="34" fill="#0f766e" />
    <rect y="852" width="900" height="348" fill="#17201d" />
  </g>
  <text x="74" y="102" fill="#0f766e" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="3">AALTO UNIVERSITY COURSE BOOK</text>
  <g fill="#17201d" font-family="Georgia, Cambria, 'Times New Roman', serif" font-weight="500">
    <text x="74" y="594" font-size="60">Elements of</text>
    <text x="74" y="678" font-size="60">Scalable</text>
    <text x="74" y="762" font-size="60">Web Development</text>
  </g>
  <g fill="#ffffff" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="25" font-weight="500">
    <text x="74" y="932">Architecture, measurement, scaling</text>
    <text x="74" y="970">pressure, and agentic workflows</text>
  </g>
  <text x="74" y="1042" fill="#ffffff" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="40" font-weight="600">Juho Vepsäläinen</text>
  <rect x="74" y="1070" width="260" height="6" fill="#0f766e" rx="3" />
</svg>
