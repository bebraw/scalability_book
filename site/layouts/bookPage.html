<div class="book-shell">
  <Raw &html="(resolve bookSidebar)"></Raw>
  <main
    class="chapter-main"
    id="content"
    data-comments-root
    &data-chapter-slug="(resolve chapterSlug)"
  >
    <section
      class="editor-panel"
      data-editor
      &data-chapter-slug="(resolve chapterSlug)"
      hidden
    >
      <div>
        <h2>Edit book page Markdown</h2>
        <p>
          Local editing mode writes directly to
          <span &children="(resolve chapterFile)"></span>.
        </p>
      </div>
      <textarea
        data-editor-source
        spellcheck="true"
        aria-label="Book page Markdown source"
      ></textarea>
      <div class="editor-actions">
        <button type="button" data-editor-save>Save page</button>
        <button type="button" data-editor-cancel>Cancel</button>
        <span data-editor-status role="status" aria-live="polite"></span>
      </div>
    </section>
    <article class="prose">
      <p class="chapter-kicker" &children="(resolve chapterLabel)"></p>
      <Raw &html="(resolve content)"></Raw>
    </article>
    <section class="reflection-prompts" data-reflection-prompts hidden>
      <h2>Reflection</h2>
      <button
        type="button"
        data-reflection-button="What concept, step, or example still feels unclear after reading this chapter?"
      >
        Still unclear
      </button>
      <button
        type="button"
        data-reflection-button="What example would make this chapter clearer?"
      >
        Missing example
      </button>
      <button
        type="button"
        data-reflection-button="What design trade-off do you understand better after reading this chapter?"
      >
        Trade-off learned
      </button>
    </section>
    <nav class="chapter-pagination" aria-label="Chapter navigation">
      <Raw &html="(resolve previousLink)"></Raw>
      <Raw &html="(resolve nextLink)"></Raw>
    </nav>
  </main>
  <Raw &html="(resolve localToc)"></Raw>
</div>
