<div class="case-study-shell">
  <aside class="case-study-context" aria-label="Case study navigation">
    <p>Case study</p>
    <a href="/case-studies/">All case studies</a>
    <a &href="(resolve repositoryUrl)">View source project</a>
  </aside>

  <main class="case-study-main" id="content">
    <article class="prose case-study-prose">
      <p class="chapter-kicker">Development system case study</p>
      <Raw &html="(resolve content)"></Raw>
    </article>
  </main>

  <aside class="case-study-outline local-toc">
    <p>In this case</p>
    <ol>
      <Raw &html="(resolve caseStudyToc)"></Raw>
    </ol>
  </aside>
</div>
