<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title &children="(resolve title)"></title>
    <meta name="description" &content="(resolve description)" />
    <link rel="canonical" &href="(resolve canonicalUrl)" />
    <meta property="og:title" &content="(resolve title)" />
    <meta property="og:description" &content="(resolve description)" />
    <meta property="og:url" &content="(resolve canonicalUrl)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" &content="(resolve siteTitle)" />
    <meta property="og:image" &content="(resolve ogImageUrl)" />
    <meta property="og:image:secure_url" &content="(resolve ogImageUrl)" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" &content="(resolve ogImageAlt)" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" &content="(resolve title)" />
    <meta name="twitter:description" &content="(resolve description)" />
    <meta name="twitter:image" &content="(resolve ogImageUrl)" />
    <meta name="twitter:image:alt" &content="(resolve ogImageAlt)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <Raw &html="(resolve stylesheetTags)"></Raw>
    <script src="/theme.js" defer></script>
    <Raw &html="(resolve scriptTags)"></Raw>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="/"
        ><span &children="(resolve siteTitle)"></span
      ></a>
      <div class="header-actions">
        <nav aria-label="Primary">
          <a href="/">Contents</a>
          <a href="/project/">Project</a>
          <a href="/case-studies/">Cases</a>
          <a href="/demos/">Demos</a>
        </nav>
        <label class="theme-picker">
          <span class="visually-hidden">Theme</span>
          <svg
            class="theme-picker-icon"
            aria-hidden="true"
            viewBox="0 0 20 20"
            width="20"
            height="20"
            focusable="false"
          >
            <circle
              cx="10"
              cy="10"
              r="6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            ></circle>
            <path d="M10 3.5a6.5 6.5 0 0 0 0 13Z" fill="currentColor"></path>
          </svg>
          <select data-theme-picker &foreach="(resolve themes)">
            <option &value="(resolve id)" &children="(resolve label)"></option>
          </select>
        </label>
        <button
          class="tools-toggle"
          type="button"
          data-tools-toggle
          aria-controls="site-tools-panel"
          aria-expanded="false"
          hidden
        >
          Tools
        </button>
        <div class="site-tools-panel" id="site-tools-panel" data-tools-panel>
          <button class="edit-toggle" type="button" data-editor-toggle hidden>
            Edit
          </button>
          <div class="feedback-controls" data-comments-controls hidden>
            <span data-comments-status role="status" aria-live="polite"></span>
            <label data-comments-view-control hidden>
              <span class="visually-hidden">Feedback view</span>
              <select data-comments-view>
                <option value="admin">Admin view</option>
                <option value="student">Student view</option>
                <option value="public">Public view</option>
              </select>
            </label>
            <button type="button" data-comments-export hidden>Export</button>
            <a href="/admin/feedback/" data-feedback-admin-link hidden
              >Review all</a
            >
            <button type="button" data-comments-login hidden>Sign in</button>
            <button type="button" data-comments-logout hidden>Sign out</button>
          </div>
        </div>
      </div>
    </header>
    <Raw &html="(resolve children)"></Raw>
    <footer class="site-footer">
      <p>
        <span &children="(resolve siteTitle)"></span> by
        <a
          &href="(resolve authorUrl)"
          rel="author"
          &children="(resolve authorName)"
        ></a
        >.
      </p>
    </footer>
  </body>
</html>
