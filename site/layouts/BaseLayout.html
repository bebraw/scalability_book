<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <Raw &html="(resolve themeBootstrap)"></Raw>
    <title &children="(resolve title)"></title>
    <meta name="description" &content="(resolve description)" />
    <meta name="book-content-revision" &content="(resolve learningRevision)" />
    <link rel="canonical" &href="(resolve canonicalUrl)" />
    <meta property="og:title" &content="(resolve title)" />
    <meta property="og:description" &content="(resolve description)" />
    <meta property="og:url" &content="(resolve canonicalUrl)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" &content="(resolve siteTitle)" />
    <meta property="og:image" &content="(resolve ogImageUrl)" />
    <meta property="og:image:secure_url" &content="(resolve ogImageUrl)" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" &content="(resolve ogImageAlt)" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" &content="(resolve title)" />
    <meta name="twitter:description" &content="(resolve description)" />
    <meta name="twitter:image" &content="(resolve ogImageUrl)" />
    <meta name="twitter:image:alt" &content="(resolve ogImageAlt)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" &href="(resolve mainStylesheetUrl)" />
    <Raw &html="(resolve stylesheetTags)"></Raw>
    <script &src="(resolve themeScriptUrl)" defer></script>
    <Raw &html="(resolve scriptTags)"></Raw>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="/"
        ><span &children="(resolve siteTitle)"></span
      ></a>
      <div class="header-actions">
        <nav aria-label="Primary">
          <a href="/">Contents</a>
          <a href="/project/introduction/">Project</a>
          <a href="/case-studies/">Cases</a>
          <a href="/demos/">Demos</a>
          <a href="/concepts/">Concepts</a>
        </nav>
        <div
          class="learning-launchers"
          role="group"
          aria-label="Learning tools"
          hidden
        >
          <button
            type="button"
            class="learning-toggle"
            data-learning-cockpit
            aria-label="Learning cockpit"
            aria-controls="learning-cockpit"
            aria-expanded="false"
            title="Learning cockpit"
            hidden
          >
            <svg
              class="learning-launcher-icon"
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="24"
              height="24"
            >
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="m15.5 8.5-2 5-5 2 2-5Z"></path>
            </svg>
            <span class="learning-launcher-label">Cockpit</span>
          </button>
          <button
            type="button"
            class="learning-toggle"
            data-learning-toggle="notebook"
            aria-label="Notebook"
            aria-controls="learning-notebook"
            aria-expanded="false"
            aria-haspopup="dialog"
            title="Notebook"
            hidden
          >
            <svg
              class="learning-launcher-icon"
              aria-hidden="true"
              focusable="false"
              viewBox="0 0 24 24"
              width="24"
              height="24"
            >
              <path
                d="M6 3.5h12a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"
              ></path>
              <path
                d="M8 3.5v17M2.5 7H6M2.5 12H6M2.5 17H6M11 8h5M11 12h5"
              ></path>
            </svg>
            <span class="learning-launcher-label">Notebook</span>
          </button>
          <button
            type="button"
            class="learning-toggle"
            data-learning-toggle="assistant"
            aria-label="Teaching assistant"
            aria-controls="learning-assistant"
            aria-expanded="false"
            aria-haspopup="dialog"
            title="Teaching assistant"
            hidden
          >
            <svg
              class="learning-launcher-icon"
              aria-hidden="true"
              focusable="false"
              viewBox="0 0 24 24"
              width="24"
              height="24"
            >
              <path
                d="M7 4.5h10a3.5 3.5 0 0 1 3.5 3.5v6a3.5 3.5 0 0 1-3.5 3.5h-6l-5 3v-3A3.5 3.5 0 0 1 3.5 14V8A3.5 3.5 0 0 1 7 4.5Z"
              ></path>
              <path
                d="M9.75 9a2.25 2.25 0 1 1 3.5 1.87c-.9.56-1.25.9-1.25 1.63M12 14.5h.01"
              ></path>
            </svg>
            <span class="learning-launcher-label">Assistant</span>
          </button>
        </div>
        <button
          type="button"
          class="account-toggle"
          data-account-toggle
          aria-controls="site-account"
          aria-expanded="false"
          aria-haspopup="dialog"
          hidden
        >
          Account
        </button>
        <label class="theme-picker">
          <span class="visually-hidden">Theme</span>
          <svg
            class="theme-picker-icon"
            aria-hidden="true"
            viewBox="0 0 20 20"
            width="20"
            height="20"
            focusable="false"
          >
            <circle
              cx="10"
              cy="10"
              r="6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            ></circle>
            <path d="M10 3.5a6.5 6.5 0 0 0 0 13Z" fill="currentColor"></path>
          </svg>
          <select data-theme-picker &foreach="(resolve themes)">
            <option &value="(resolve id)" &children="(resolve label)"></option>
          </select>
        </label>
        <button
          class="tools-toggle"
          type="button"
          data-tools-toggle
          aria-controls="site-tools-panel"
          aria-expanded="false"
          hidden
        >
          <span>Tools</span>
          <svg
            class="tools-toggle-chevron"
            aria-hidden="true"
            viewBox="0 0 12 8"
            width="12"
            height="8"
            focusable="false"
          >
            <path d="m1 1 5 5 5-5"></path>
          </svg>
        </button>
        <div
          class="site-tools-panel"
          id="site-tools-panel"
          data-tools-panel
          role="group"
          aria-label="Book tools"
        >
          <a
            class="feedback-overview-link"
            href="/admin/feedback/"
            data-feedback-admin-link
            hidden
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              focusable="false"
            >
              <path d="M5 5.5h14v10H9l-4 3v-13Z"></path>
              <path d="M8.5 9h7M8.5 12h5"></path>
            </svg>
            <span>
              <strong>Feedback overview</strong>
              <small>Review comments from across the book</small>
            </span>
          </a>
          <button class="edit-toggle" type="button" data-editor-toggle hidden>
            Edit
          </button>
          <div class="feedback-controls" data-comments-controls hidden>
            <span data-comments-status role="status" aria-live="polite"></span>
            <label data-comments-view-control hidden>
              <span class="visually-hidden">Feedback view</span>
              <select data-comments-view>
                <option value="admin">Admin view</option>
                <option value="student">Student view</option>
                <option value="public">Public view</option>
              </select>
            </label>
            <button type="button" data-comments-export hidden>Export</button>
            <button type="button" data-comments-login hidden>Sign in</button>
            <button type="button" data-comments-logout hidden>Sign out</button>
          </div>
        </div>
      </div>
    </header>
    <Raw &html="(resolve children)"></Raw>
    <footer class="site-footer">
      <p>
        <span &children="(resolve siteTitle)"></span> by
        <a
          &href="(resolve authorUrl)"
          rel="author"
          &children="(resolve authorName)"
        ></a
        >.
      </p>
    </footer>
  </body>
</html>
