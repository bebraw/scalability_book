name: Learning companion package
on:
  push:
    branches: [main]
    paths:
      - "packages/learning-companion/**"
      - "scripts/**learning**"
      - "scripts/lib/learning-*.ts"
      - "shared/**"
      - "tests/learning-*.test.ts"
      - "package*.json"
      - ".github/workflows/learning-companion.yml"
  pull_request:
    paths:
      - "packages/learning-companion/**"
      - "scripts/**learning**"
      - "scripts/lib/learning-*.ts"
      - "shared/**"
      - "tests/learning-*.test.ts"
      - "package*.json"
      - ".github/workflows/learning-companion.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test tests/learning-notebook.test.ts tests/learning-companion.test.ts tests/learning-agent.test.ts tests/learning-storage.test.ts tests/learning-client.test.ts
      - run: npm run companion:pack
      - run: npm run companion:check
