<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event filter fixture</title>
  </head>
  <body>
    <main>
      <h1>Recorded events</h1>
      <label>
        Filter events
        <input type="search" data-filter />
      </label>
      <ul aria-label="Events">
        <li>event.created</li>
        <li>storage.retry</li>
        <li>event.observed</li>
      </ul>
    </main>
    <script>
      const filter = document.querySelector("[data-filter]");
      const events = [...document.querySelectorAll("li")];

      filter.addEventListener("input", () => {
        const query = filter.value.toLowerCase();

        for (const event of events) {
          event.hidden = !event.textContent.toLowerCase().includes(query);
        }
      });
    </script>
  </body>
</html>
