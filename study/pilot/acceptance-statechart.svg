<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Acceptance requires checks and review</title><desc id="desc">Planning leads to implementation, then parallel checks and review. Both must accept before release.</desc><rect width="1200" height="560" fill="#f7f7f2"/><g font-family="Arial,sans-serif"><text x="40" y="60" font-size="38" fill="#20342d">Acceptance requires checks and review</text><text x="40" y="145" font-size="36" fill="#20342d">Plan → Implement → Verify → Ready → Release</text><rect x="180" y="205" width="360" height="80" fill="#e4eade"/><text x="205" y="255" font-size="28" fill="#20342d">Checks: tests pass</text><rect x="660" y="205" width="360" height="80" fill="#e4eade"/><text x="685" y="255" font-size="28" fill="#20342d">Review: approved</text><text x="370" y="345" font-size="30" fill="#20342d">Both required for readiness</text><text x="40" y="416" font-size="25" fill="#20342d">Failed checks or requested changes return work to implementation.</text><text x="40" y="459" font-size="25" fill="#20342d">Cancellation is available throughout active work.</text><text x="40" y="522" font-size="19" fill="#46594d">Illustrative model · use the interactive version to explore the behavior</text></g></svg>