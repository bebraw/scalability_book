<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Check averages at one boundary</title><desc id="desc">20 operations per second times 0.5 seconds gives 10 operations in progress.</desc><rect width="1200" height="560" fill="#f7f7f2"/><g font-family="Arial,sans-serif"><text x="40" y="60" font-size="38" fill="#20342d">Check averages at one boundary</text><text x="40" y="172" font-size="64" fill="#20342d">20/s × 0.5 s = 10</text><text x="40" y="233" font-size="26" fill="#20342d">L = λW · expected average work in progress</text><text x="40" y="315" font-size="24" fill="#20342d">Calculated L</text><rect x="300" y="288" width="400" height="35" fill="#39765a"/><text x="730" y="315" font-size="26" fill="#20342d">10</text><text x="40" y="375" font-size="24" fill="#20342d">Observed L</text><rect x="300" y="348" width="400" height="35" fill="#a94225"/><text x="730" y="375" font-size="26" fill="#20342d">10</text><text x="40" y="445" font-size="24" fill="#20342d">Same work, boundary, and window; balanced arrivals and completions.</text><text x="40" y="522" font-size="19" fill="#46594d">Illustrative model · use the interactive version to explore the behavior</text></g></svg>