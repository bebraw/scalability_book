<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Sequential work bounds ideal speedup</title><desc id="desc">With 80 percent parallel work and four workers, ideal speedup is 2.5 times.</desc><rect width="1200" height="560" fill="#f7f7f2"/><g font-family="Arial,sans-serif"><text x="40" y="60" font-size="38" fill="#20342d">Sequential work bounds ideal speedup</text><text x="40" y="172" font-size="86" fill="#20342d">2.50×</text><text x="42" y="225" font-size="26" fill="#20342d">80% parallel work · four workers</text><rect x="40" y="270" width="1120" height="50" fill="#e0e6dc"/><rect x="40" y="270" width="224" height="50" fill="#a94225"/><rect x="264" y="270" width="224" height="50" fill="#39765a"/><text x="40" y="370" font-size="26" fill="#20342d">Sequential: 0.20 + parallel: 0.80/4 = 0.40 of the original time</text><text x="40" y="420" font-size="26" fill="#20342d">S = 1 / 0.40 = 2.5. Fixed workload; no coordination overhead.</text><text x="40" y="522" font-size="19" fill="#46594d">Illustrative model · use the interactive version to explore the behavior</text></g></svg>