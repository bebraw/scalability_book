<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Where does change time go?</title><style>*{box-sizing:border-box}body{margin:0;padding:24px 30px;background:#f7f7f2;color:#20342d;font:21px/1.35 Arial,sans-serif}h1{font:34px/1.1 Georgia,serif;margin:0 0 20px}h2{font:26px Georgia,serif;margin:10px 0}p{margin:10px 0}.large{font-size:64px;font-weight:700;letter-spacing:-2px}.muted,footer{font-size:16px;color:#4c5b52}footer{border-top:1px solid #cad2c7;padding-top:12px;margin-top:18px}.result{min-height:95px}.row{display:flex;gap:20px;align-items:center}.row>*{flex:1}.controls{border-top:1px solid #b4c4b3;margin-top:18px;padding-top:12px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end}label{font-size:17px;flex:1;min-width:130px}input[type=range]{display:block;width:100%;accent-color:#39765a}button,select{font:17px Arial,sans-serif;color:#20342d;background:#fff;border:1px solid #829680;border-radius:4px;padding:9px 12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9b4625;outline-offset:3px}output{font-weight:700}.bar{height:28px;background:#dfe6da;margin:9px 0;display:flex}.bar i{display:block;background:#39765a;height:100%;font-style:normal}.bar .warn{background:#a94225}.stages{display:flex;gap:8px;margin:20px 0}.node{flex:1;border-top:4px solid #b6c3b2;padding:12px 8px;background:#e9ede3;font-size:19px}.node.active{border-color:#a94225;background:#f4e3d8}.node small{display:block;font-size:15px;margin-top:8px}.history{font-size:16px;margin-top:14px;min-height:22px}[hidden]{display:none!important}table{border-collapse:collapse;width:100%;font-size:21px}td,th{text-align:left;border-bottom:1px solid #cad2c7;padding:10px 8px}th{font-size:16px}svg{max-width:100%}@media(max-width:650px){body{padding:14px;font-size:18px}h1{font-size:27px;margin-bottom:12px}.large{font-size:48px}.node{font-size:15px;padding:8px 5px}.node small{font-size:13px}.controls{gap:8px}footer{font-size:13px;margin-top:10px}.row{gap:12px}}</style><body><h1>Where does change time go?</h1><div class="row"><div><span class="large" id="total"></span><p>illustrative minutes to accepted change</p></div><div><h2 id="saving"></h2><p id="judgment"></p></div></div><div id="breakdown"></div><div class="controls" id="controls"><label>Setup<input id="setup" type="range" min="0" max="30" value="10"></label><label>Understanding<input id="understand" type="range" min="0" max="30" value="15"></label><label>Editing<input id="edit" type="range" min="0" max="30" value="10"></label><label>Checks and review<input id="review" type="range" min="0" max="30" value="25"></label><button id="fast-edit">Halve editing time</button></div><footer>Adapted from the friction-audit categories. Invented sequential timings for discussion, not calibrated productivity estimates. Bars share a 0–30 minute scale. Real work may overlap and require rework.</footer><script>const $=id=>document.getElementById(id);let state={};const controller=LectureDemo.role==='controller';$('controls').hidden=!controller;const show=(id,text)=>$(id).textContent=text;const clamp=(v,min,max)=>Math.min(max,Math.max(min,Number(v)));const send=next=>{if(controller)LectureDemo.setState(next)};const labels={setup:'Setup',understand:'Understanding',edit:'Editing',review:'Checks and review'};LectureDemo.onState(next=>{state={setup:10,understand:15,edit:10,review:25,...next};const total=Object.keys(labels).reduce((a,k)=>a+state[k],0);show('total',total);show('saving',`Editing is ${total?Math.round(state.edit/total*100):0}% of total time`);show('judgment','Faster generation affects only the part of the workflow it replaces.');$('breakdown').innerHTML=Object.keys(labels).map(k=>`<div class="row"><span>${labels[k]} · ${state[k]} min</span><div class="bar"><i class="${k==='edit'?'warn':''}" style="width:${state[k]/30*100}%"></i></div></div>`).join('');for(const k of Object.keys(labels))$(k).value=state[k];});for(const k of Object.keys(labels))$(k).oninput=()=>send({...state,[k]:Number($(k).value)});$('fast-edit').onclick=()=>send({...state,edit:state.edit/2});</script></body></html>
