<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">The first binding limit</title><desc id="desc">A pipeline with capacities 180, 110, 150, and 130 attempts per second is bounded by 110.</desc><rect width="1200" height="560" fill="#f7f7f2"/><g font-family="Arial,sans-serif"><text x="40" y="60" font-size="38" fill="#20342d">The first binding limit</text><text x="40" y="155" font-size="25" fill="#20342d">API</text><rect x="250" y="129" width="720" height="32" fill="#39765a"/><text x="1010" y="155" font-size="25" fill="#20342d">180/s</text><text x="40" y="223" font-size="25" fill="#20342d">Database</text><rect x="250" y="197" width="440" height="32" fill="#a94225"/><text x="1010" y="223" font-size="25" fill="#20342d">110/s</text><text x="40" y="291" font-size="25" fill="#20342d">Workers</text><rect x="250" y="265" width="600" height="32" fill="#39765a"/><text x="1010" y="291" font-size="25" fill="#20342d">150/s</text><text x="40" y="359" font-size="25" fill="#20342d">Downstream</text><rect x="250" y="333" width="520" height="32" fill="#39765a"/><text x="1010" y="359" font-size="25" fill="#20342d">130/s</text><text x="40" y="455" font-size="23" fill="#20342d">At 100 attempts/s and no retries, demand stays below all declared capacities.</text><text x="40" y="522" font-size="19" fill="#46594d">Illustrative model · use the interactive version to explore the behavior</text></g></svg>