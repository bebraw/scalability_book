<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The first binding limit</title><style>*{box-sizing:border-box}body{margin:0;padding:24px 30px;background:#f7f7f2;color:#20342d;font:21px/1.35 Arial,sans-serif}h1{font:34px/1.1 Georgia,serif;margin:0 0 20px}h2{font:26px Georgia,serif;margin:10px 0}p{margin:10px 0}.large{font-size:64px;font-weight:700;letter-spacing:-2px}.muted,footer{font-size:16px;color:#4c5b52}footer{border-top:1px solid #cad2c7;padding-top:12px;margin-top:18px}.result{min-height:95px}.row{display:flex;gap:20px;align-items:center}.row>*{flex:1}.controls{border-top:1px solid #b4c4b3;margin-top:18px;padding-top:12px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end}label{font-size:17px;flex:1;min-width:130px}input[type=range]{display:block;width:100%;accent-color:#39765a}button,select{font:17px Arial,sans-serif;color:#20342d;background:#fff;border:1px solid #829680;border-radius:4px;padding:9px 12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9b4625;outline-offset:3px}output{font-weight:700}.bar{height:28px;background:#dfe6da;margin:9px 0;display:flex}.bar i{display:block;background:#39765a;height:100%;font-style:normal}.bar .warn{background:#a94225}.stages{display:flex;gap:8px;margin:20px 0}.node{flex:1;border-top:4px solid #b6c3b2;padding:12px 8px;background:#e9ede3;font-size:19px}.node.active{border-color:#a94225;background:#f4e3d8}.node small{display:block;font-size:15px;margin-top:8px}.history{font-size:16px;margin-top:14px;min-height:22px}[hidden]{display:none!important}table{border-collapse:collapse;width:100%;font-size:21px}td,th{text-align:left;border-bottom:1px solid #cad2c7;padding:10px 8px}th{font-size:16px}svg{max-width:100%}@media(max-width:650px){body{padding:14px;font-size:18px}h1{font-size:27px;margin-bottom:12px}.large{font-size:48px}.node{font-size:15px;padding:8px 5px}.node small{font-size:13px}.controls{gap:8px}footer{font-size:13px;margin-top:10px}.row{gap:12px}}</style><body><h1>The first binding limit</h1><div class="row"><div><span class="large" id="demand"></span><p>attempts/s offered to every stage</p></div><div><h2 id="limit"></h2><p id="effect" role="status"></p></div></div><div id="pipeline"></div><p id="next-limit"></p><div class="controls" id="controls"><label>New work /s <output id="load-label"></output><input id="load" type="range" min="20" max="200" step="5"></label><label>Retry overhead <output id="retry-label"></output><input id="retry" type="range" min="0" max="100" step="5"></label><label><input id="admission" type="checkbox"> Reject excess at ingress</label><button id="expand">Add 40/s at limit</button></div><footer>Adapted from the book’s saturation-boundary lab. Declared rates only. Every attempt uses every stage once. Admission rejects excess attempts; this does not predict latency, retry cascades, or queue recovery.</footer><script>const $=id=>document.getElementById(id);let state={};const controller=LectureDemo.role==='controller';$('controls').hidden=!controller;const show=(id,text)=>$(id).textContent=text;const clamp=(v,min,max)=>Math.min(max,Math.max(min,Number(v)));const send=next=>{if(controller)LectureDemo.setState(next)};const names=['API','Database','Workers','Downstream'];LectureDemo.onState(next=>{state={load:100,retry:0,admission:false,capacities:[180,110,150,130],...next};const demand=state.load*(1+state.retry/100),min=Math.min(...state.capacities),idx=state.capacities.indexOf(min),excess=Math.max(0,demand-min);show('demand',demand.toFixed(0));show('limit',names[idx]+' · '+min+'/s');show('effect',excess===0?`${(min-demand).toFixed(0)}/s spare capacity in this rate model`:state.admission?`${excess.toFixed(0)}/s explicitly rejected`:`Backlog grows by ${excess.toFixed(0)}/s`);$('pipeline').innerHTML=names.map((name,i)=>`<div class="row"><span>${name} · ${state.capacities[i]}/s</span><div class="bar"><i class="${i===idx?'warn':''}" style="width:${Math.min(100,demand/state.capacities[i]*100)}%"></i></div><span>${Math.round(demand/state.capacities[i]*100)}% offered/capacity</span></div>`).join('');const ranked=[...state.capacities].sort((a,b)=>a-b);show('next-limit','Next declared capacity: '+ranked[1]+'/s. Changing the limit can move the bottleneck.');$('load').value=state.load;$('retry').value=state.retry;$('admission').checked=state.admission;show('load-label',state.load);show('retry-label',state.retry+'%');$('expand').disabled=state.capacities.every(x=>x>=300);});for(const id of ['load','retry'])$(id).oninput=()=>send({...state,[id]:Number($(id).value)});$('admission').onchange=()=>send({...state,admission:$('admission').checked});$('expand').onclick=()=>{const c=[...state.capacities],min=Math.min(...c),idx=c.indexOf(min);c[idx]=Math.min(300,c[idx]+40);send({...state,capacities:c})};</script></body></html>
