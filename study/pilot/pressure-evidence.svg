<svg xmlns="http://www.w3.org/2000/svg"
  class="book-diagram linear-flow-diagram"
  data-book-diagram="pressure-evidence"
  viewBox="0 0 1206 370"
  role="img"
  aria-labelledby="pressure-evidence-title pressure-evidence-description"
  preserveAspectRatio="xMidYMid meet"
><style>:root{--text:#20342d;--muted:#46594d;--bg:#f7f7f2;--panel:#fff;--border:#b9c6b8;--accent:#39765a;--accent-strong:#28583f;--font-ui:Arial,sans-serif}body{margin:0;padding:24px;background:var(--bg);color:var(--text);font:20px/1.3 Arial,sans-serif}h1{font:34px Georgia,serif;margin:0 0 16px}/* Static pedagogical figures generated as SVG during the book build. */
.book-diagram-figure {
  inline-size: calc(100% + var(--book-demo-inline-extension, 0rem));
  margin: 2.15rem 0 2.4rem;
  max-width: 64rem;
}

.book-diagram-canvas {
  background:
    linear-gradient(
      color-mix(in srgb, var(--text) 3%, transparent) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      color-mix(in srgb, var(--text) 3%, transparent) 1px,
      transparent 1px
    ),
    color-mix(in srgb, var(--text) 1.5%, var(--panel));
  background-size: 1.5rem 1.5rem;
  border: 1px solid var(--border);
  border-radius: 0.45rem;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  padding: clamp(0.5rem, 1.2vw, 0.85rem);
}

.book-diagram-canvas:focus-visible {
  outline: 3px solid var(--accent-strong);
  outline-offset: 0.2rem;
}

.book-diagram {
  display: block;
  height: auto;
  width: 100%;
}

.book-diagram text {
  fill: var(--text);
  font-family: var(--font-ui);
}

.book-diagram-kicker {
  fill: var(--accent-strong) !important;
  font-size: 13px;
  font-weight: 850;
  letter-spacing: 1.2px;
}

.book-diagram-title {
  font-size: 20px;
  font-weight: 850;
}

.book-diagram-detail {
  fill: var(--muted) !important;
  font-size: 15px;
  font-weight: 650;
}

.book-diagram-node > rect {
  fill: var(--bg);
  stroke: var(--border);
  stroke-width: 1.5;
}

.book-diagram-marker path {
  fill: var(--accent-strong);
}

.linear-flow-diagram {
  min-width: 62rem;
}

.linear-flow-connectors path,
.linear-flow-feedback path {
  fill: none;
  stroke: var(--accent-strong);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2.2;
}

.linear-flow-node.is-emphasis > rect {
  fill: color-mix(in srgb, var(--accent) 12%, var(--bg));
  stroke: var(--accent-strong);
  stroke-width: 2;
}

.linear-flow-node.is-danger > rect {
  fill: color-mix(in srgb, #c74c42 10%, var(--bg));
  stroke: color-mix(in srgb, #c74c42 72%, var(--text));
  stroke-width: 2;
}

.linear-flow-feedback rect,
.linear-flow-note rect,
.knowledge-boundary-link-label rect,
.three-loops-return-label rect {
  fill: color-mix(in srgb, var(--accent) 12%, var(--panel));
  stroke: var(--accent-strong);
  stroke-width: 1;
}

.linear-flow-feedback text,
.knowledge-boundary-link-label text,
.three-loops-return-label text {
  fill: var(--accent-strong);
  font-size: 12px;
  font-weight: 850;
  letter-spacing: 0.35px;
}

.linear-flow-note rect {
  fill: color-mix(in srgb, var(--text) 3%, var(--panel));
  stroke: var(--border);
  stroke-dasharray: 5 4;
}

.knowledge-boundary-diagram {
  min-width: 46rem;
}

.knowledge-boundary-source > rect,
.three-loops-shared > rect {
  fill: color-mix(in srgb, var(--accent) 11%, var(--panel));
  stroke: color-mix(in srgb, var(--accent-strong) 68%, var(--border));
  stroke-width: 1.5;
}

.knowledge-boundary-source-title {
  font-size: 23px;
}

.knowledge-boundary-connectors path {
  fill: none;
  stroke: var(--accent-strong);
  stroke-linecap: round;
  stroke-width: 2.2;
}

.knowledge-boundary-link-label rect {
  fill: var(--panel);
}

.knowledge-boundary-link-label text {
  font-size: 11px;
  letter-spacing: 0.7px;
}

.knowledge-boundary-product.is-slideotter > rect {
  fill: color-mix(in srgb, var(--accent) 7%, var(--bg));
}

.knowledge-boundary-product.is-kirjolab > rect {
  fill: color-mix(in srgb, var(--text) 3%, var(--bg));
}

.knowledge-boundary-item-mark {
  fill: var(--accent-strong);
  stroke: none;
}

.three-loops-diagram {
  min-width: 58rem;
}

.three-loops-shared-links path {
  fill: none;
  stroke: var(--border);
  stroke-dasharray: 5 5;
  stroke-width: 1.5;
}

.three-loops-shared-marker path {
  fill: var(--border);
}

.three-loops-connections path {
  fill: none;
  stroke: var(--accent-strong);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2.3;
}

.three-loops-card.is-application-loop > rect {
  fill: color-mix(in srgb, var(--accent) 7%, var(--bg));
}

.three-loops-card.is-development-loop > rect {
  fill: color-mix(in srgb, var(--text) 3%, var(--bg));
}

.three-loops-card.is-agentic-loop > rect {
  fill: color-mix(in srgb, var(--accent) 12%, var(--bg));
  stroke: var(--accent-strong);
  stroke-width: 2;
}

.three-loops-purpose {
  font-size: 14px;
}

.three-loops-sequence {
  fill: var(--muted) !important;
  font-size: 14px;
  font-weight: 700;
}

.book-diagram-figure figcaption {
  color: var(--muted);
  font-family: var(--font-serif);
  font-size: 0.96rem;
  inline-size: 100%;
  line-height: 1.48;
  margin-block-start: 0.75rem;
  max-width: none;
}

@media print {
  .book-diagram-canvas {
    overflow: visible;
  }

  .book-diagram {
    min-width: 0 !important;
  }
}
.progression-diagram {
  min-width: 58rem;
}
.progression-shared > rect {
  fill: color-mix(in srgb, var(--accent) 11%, var(--panel));
  stroke: color-mix(in srgb, var(--accent-strong) 68%, var(--border));
  stroke-width: 1.5;
}
.progression-kicker {
  fill: var(--accent-strong) !important;
  font-size: 13px;
  font-weight: 850;
  letter-spacing: 1.2px;
}
.progression-shared-title,
.progression-stage-title,
.progression-outcome-title {
  font-size: 20px;
  font-weight: 850;
}
.progression-shared-title {
  font-size: 23px;
}
.progression-detail {
  fill: var(--muted) !important;
  font-size: 15px;
  font-weight: 650;
}
.progression-shared-links path {
  fill: none;
  stroke: var(--border);
  stroke-dasharray: 5 5;
  stroke-width: 1.5;
}
.progression-stage > rect {
  fill: var(--bg);
  stroke: var(--border);
  stroke-width: 1.5;
}
.progression-fresh rect {
  fill: color-mix(in srgb, var(--text) 5%, var(--panel));
  stroke: var(--border);
}
.progression-fresh text {
  fill: var(--muted);
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 0.8px;
}
.progression-learning path {
  fill: none;
  stroke: var(--accent-strong);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 2.5;
}
.progression-learning rect {
  fill: color-mix(in srgb, var(--accent) 14%, var(--panel));
  stroke: var(--accent-strong);
  stroke-width: 1;
}
.progression-learning text {
  fill: var(--accent-strong);
  font-size: 12px;
  font-weight: 850;
  letter-spacing: 0.4px;
}
.progression-outcome > rect {
  fill: color-mix(in srgb, var(--accent) 13%, var(--bg));
  stroke: var(--accent-strong);
  stroke-width: 2;
}
.progression-reset rect {
  fill: color-mix(in srgb, var(--text) 3%, var(--panel));
  stroke: var(--border);
  stroke-dasharray: 5 4;
}
.progression-reset path {
  fill: none;
  stroke: var(--muted);
  stroke-linecap: round;
  stroke-width: 2;
}
.progression-reset text {
  fill: var(--muted);
  font-size: 13px;
  font-weight: 750;
}
.progression-arrow-marker path {
  fill: var(--accent-strong);
}
.progression-shared-arrow-marker path {
  fill: var(--border);
}
.book-diagram{min-width:0!important;width:100%;max-height:62vh}#controls{display:flex;gap:12px;margin-top:10px}button{font:18px Arial;padding:10px;background:#fff;border:1px solid #829680;cursor:pointer}footer{font-size:15px;margin-top:16px}[hidden]{display:none!important} .book-diagram{min-width:0!important;width:100%;height:100%;max-height:none}</style>
  <title id="pressure-evidence-title">Reason from pressure to evidence</title>
  <desc id="pressure-evidence-description">A five-step reasoning chain moves from a named pressure to the first binding limit, a targeted response, its new trade-off, and evidence that can challenge the claim and begin another pass.</desc>
  <defs>
    <marker id="pressure-evidence-arrow" class="book-diagram-marker" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z"></path>
    </marker>
  </defs>

  <g class="linear-flow-connectors" aria-hidden="true">
    <path d="M 228 163 L 260 163" marker-end="url(#pressure-evidence-arrow)"></path>
    <path d="M 464 163 L 496 163" marker-end="url(#pressure-evidence-arrow)"></path>
    <path d="M 700 163 L 732 163" marker-end="url(#pressure-evidence-arrow)"></path>
    <path d="M 936 163 L 968 163" marker-end="url(#pressure-evidence-arrow)"></path>
  </g>

  <g class="linear-flow-nodes">
    <g class="book-diagram-node linear-flow-node" data-diagram-container="pressure" data-diagram-node="pressure">
      <rect x="34" y="76" width="194" height="174" rx="12"></rect>
      <text class="book-diagram-kicker" x="52" y="105">1 · INPUT</text>
      <text class="book-diagram-title" x="52" y="139"><tspan x="52" dy="0">Pressure</tspan></text>
      <text class="book-diagram-detail" x="52" y="174"><tspan x="52" dy="0">Name what changes</tspan><tspan x="52" dy="21">and its plausible range</tspan></text>
    </g>
    <g class="book-diagram-node linear-flow-node" data-diagram-container="binding-limit" data-diagram-node="binding-limit">
      <rect x="270" y="76" width="194" height="174" rx="12"></rect>
      <text class="book-diagram-kicker" x="288" y="105">2 · LOCATE</text>
      <text class="book-diagram-title" x="288" y="139"><tspan x="288" dy="0">Binding limit</tspan></text>
      <text class="book-diagram-detail" x="288" y="174"><tspan x="288" dy="0">Find the first boundary</tspan><tspan x="288" dy="21">that threatens the goal</tspan></text>
    </g>
    <g class="book-diagram-node linear-flow-node is-emphasis" data-diagram-container="response" data-diagram-node="response">
      <rect x="506" y="76" width="194" height="174" rx="12"></rect>
      <text class="book-diagram-kicker" x="524" y="105">3 · INTERVENE</text>
      <text class="book-diagram-title" x="524" y="139"><tspan x="524" dy="0">Response</tspan></text>
      <text class="book-diagram-detail" x="524" y="174"><tspan x="524" dy="0">Act at that limit</tspan><tspan x="524" dy="21">rather than elsewhere</tspan></text>
    </g>
    <g class="book-diagram-node linear-flow-node" data-diagram-container="trade-off" data-diagram-node="trade-off">
      <rect x="742" y="76" width="194" height="174" rx="12"></rect>
      <text class="book-diagram-kicker" x="760" y="105">4 · ACCOUNT</text>
      <text class="book-diagram-title" x="760" y="139"><tspan x="760" dy="0">Trade-off</tspan></text>
      <text class="book-diagram-detail" x="760" y="174"><tspan x="760" dy="0">Name cost, waiting,</tspan><tspan x="760" dy="21">complexity, or risk</tspan><tspan x="760" dy="21">moved elsewhere</tspan></text>
    </g>
    <g class="book-diagram-node linear-flow-node" data-diagram-container="evidence" data-diagram-node="evidence">
      <rect x="978" y="76" width="194" height="174" rx="12"></rect>
      <text class="book-diagram-kicker" x="996" y="105">5 · CHALLENGE</text>
      <text class="book-diagram-title" x="996" y="139"><tspan x="996" dy="0">Evidence</tspan></text>
      <text class="book-diagram-detail" x="996" y="174"><tspan x="996" dy="0">Repeat a bounded</tspan><tspan x="996" dy="21">observation of the goal</tspan></text>
    </g>
  </g>

  <g class="linear-flow-feedback" data-diagram-container="feedback">
      <path d="M 1075 250 L 1075 320 L 131 320 L 131 260" marker-end="url(#pressure-evidence-arrow)"></path>
      <rect x="368" y="300" width="470" height="40" rx="20"></rect>
      <text x="603" y="325" text-anchor="middle">Evidence can revise the limit, response, or original claim</text>
    </g>
  
</svg>