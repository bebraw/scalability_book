<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A request across web boundaries</title><style>*{box-sizing:border-box}body{margin:0;padding:24px 30px;background:#f7f7f2;color:#20342d;font:21px/1.35 Arial,sans-serif}h1{font:34px/1.1 Georgia,serif;margin:0 0 20px}h2{font:26px Georgia,serif;margin:10px 0}p{margin:10px 0}.large{font-size:64px;font-weight:700;letter-spacing:-2px}.muted,footer{font-size:16px;color:#4c5b52}footer{border-top:1px solid #cad2c7;padding-top:12px;margin-top:18px}.result{min-height:95px}.row{display:flex;gap:20px;align-items:center}.row>*{flex:1}.controls{border-top:1px solid #b4c4b3;margin-top:18px;padding-top:12px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end}label{font-size:17px;flex:1;min-width:130px}input[type=range]{display:block;width:100%;accent-color:#39765a}button,select{font:17px Arial,sans-serif;color:#20342d;background:#fff;border:1px solid #829680;border-radius:4px;padding:9px 12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9b4625;outline-offset:3px}output{font-weight:700}.bar{height:28px;background:#dfe6da;margin:9px 0;display:flex}.bar i{display:block;background:#39765a;height:100%;font-style:normal}.bar .warn{background:#a94225}.stages{display:flex;gap:8px;margin:20px 0}.node{flex:1;border-top:4px solid #b6c3b2;padding:12px 8px;background:#e9ede3;font-size:19px}.node.active{border-color:#a94225;background:#f4e3d8}.node small{display:block;font-size:15px;margin-top:8px}.history{font-size:16px;margin-top:14px;min-height:22px}[hidden]{display:none!important}table{border-collapse:collapse;width:100%;font-size:21px}td,th{text-align:left;border-bottom:1px solid #cad2c7;padding:10px 8px}th{font-size:16px}svg{max-width:100%}@media(max-width:650px){body{padding:14px;font-size:18px}h1{font-size:27px;margin-bottom:12px}.large{font-size:48px}.node{font-size:15px;padding:8px 5px}.node small{font-size:13px}.controls{gap:8px}footer{font-size:13px;margin-top:10px}.row{gap:12px}}@media(max-width:650px){.stages{flex-wrap:wrap}.node{flex:1 1 100px;min-width:0;overflow-wrap:anywhere}select{max-width:100%}}</style><body><h1>A request across web boundaries</h1><div class="stages" id="path"></div><div class="result"><h2 id="focus"></h2><p id="detail"></p></div><p id="outcome" role="status"></p><div class="controls" id="controls"><label>Scenario<select id="scenario"><option value="success">Successful write</option><option value="invalid">Invalid input</option><option value="lost">Response lost after commit</option><option value="retry">Retry with the same key</option></select></label><button id="prev">Previous boundary</button><button id="next">Next boundary</button></div><footer>Adapted from the book’s request-trace lab. Illustrative path with atomic deduplication and effect storage. A request key alone cannot guarantee exactly-once external side effects.</footer><script>const $=id=>document.getElementById(id);let state={};const controller=LectureDemo.role==='controller';$('controls').hidden=!controller;const show=(id,text)=>$(id).textContent=text;const clamp=(v,min,max)=>Math.min(max,Math.max(min,Number(v)));const send=next=>{if(controller)LectureDemo.setState(next)};const labels=['Browser','Network','API','Database','Response'];const details=['Collect user intent and construct the request.','Delivery and response may fail independently.','Authorize and validate before writing.','Commit the accepted effect and its idempotency record together.','Tell the client the accepted or rejected outcome.'];LectureDemo.onState(next=>{state={scenario:'success',step:0,...next};state.step=clamp(state.step,0,4);$('scenario').value=state.scenario;$('path').innerHTML=labels.map((x,i)=>`<div class="node ${i===state.step?'active':''}">${i+1}. ${x}</div>`).join('');show('focus',labels[state.step]);let detail=details[state.step];if(state.scenario==='invalid'&&state.step>=2)detail='Validation fails at the API. No database write occurs.';if(state.scenario==='lost'&&state.step===4)detail='The database committed, but the response is lost. The client cannot infer that no write happened.';if(state.scenario==='retry'&&state.step>=3)detail='The same idempotency key finds the recorded result. Return it without creating another event.';show('detail',detail);const final={success:'One durable effect, acknowledged to the client.',invalid:'Zero effects; the API explains the validation failure.',lost:'One durable effect; the client sees an uncertain outcome.',retry:'One durable effect across repeated attempts, within the key’s scope and retention.'};show('outcome',state.step===4?final[state.scenario]:'Predict the final stored effect and client-visible outcome.');$('prev').disabled=state.step===0;$('next').disabled=state.step===4;});$('scenario').onchange=()=>send({scenario:$('scenario').value,step:0});$('prev').onclick=()=>send({...state,step:Math.max(0,state.step-1)});$('next').onclick=()=>send({...state,step:Math.min(4,state.step+1)});</script></body></html>
