<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Faster editing affects part of the workflow</title><desc id="desc">Setup 10 minutes, understanding 15, editing 10, review 25: total 60 minutes.</desc><rect width="1200" height="560" fill="#f7f7f2"/><g font-family="Arial,sans-serif"><text x="40" y="60" font-size="38" fill="#20342d">Faster editing affects part of the workflow</text><text x="40" y="170" font-size="60" fill="#20342d">60 minutes → 55 minutes</text><text x="40" y="225" font-size="26" fill="#20342d">Halving 10 minutes of editing saves 5 minutes overall.</text><rect x="40" y="285" width="180" height="56" fill="#829680"/><text x="40" y="375" font-size="20" fill="#20342d">Setup 10</text><rect x="220" y="285" width="270" height="56" fill="#39765a"/><text x="220" y="375" font-size="20" fill="#20342d">Understand 15</text><rect x="490" y="285" width="180" height="56" fill="#a94225"/><text x="490" y="375" font-size="20" fill="#20342d">Edit 10</text><rect x="670" y="285" width="450" height="56" fill="#b9c6b8"/><text x="670" y="375" font-size="20" fill="#20342d">Review 25</text><text x="40" y="447" font-size="24" fill="#20342d">Invented sequential timings, not a measured productivity claim.</text><text x="40" y="522" font-size="19" fill="#46594d">Illustrative model · use the interactive version to explore the behavior</text></g></svg>